# Modeled on pallets' lock.yaml: a single-job workflow whose top-level write
# scopes are effectively per-job. Must NOT be flagged by GHA006.
name: Lock inactive closed issues
on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@1bf7ec25051fe7c00bdd17e6a7cf3d7bfb7dc771
