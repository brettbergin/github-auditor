# Modeled on pallets' publish.yaml: per-job scoped writes on a safe trigger
# (PyPI trusted publishing via OIDC). Must NOT be flagged by GHA006.
name: Publish
on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m build
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
