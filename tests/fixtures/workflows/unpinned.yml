name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tj-actions/changed-files@v44
      - uses: some-org/pinned-action@0123456789abcdef0123456789abcdef01234567
      - uses: ./local-action
      - run: make test
